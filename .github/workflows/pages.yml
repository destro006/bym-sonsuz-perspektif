# Builds the static site and publishes it to the gh-pages branch (GitHub Pages).
# Live URL once Pages is set to "Deploy from a branch: gh-pages / (root)":
#   https://destro006.github.io/bym-sonsuz-perspektif/
name: Pages

on:
  push:
    branches: [claude/bym-perspektif-mobile-animation-ld4t4v]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:assets
      - run: npm run build:pages
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
